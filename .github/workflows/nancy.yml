name: Go Nancy

on:
    # Scan changed files in PRs from same repository only:
    pull_request:
      types: [opened, synchronize, reopened]
    # Scan on-demand through GitHub Actions interface:
    workflow_dispatch: {}
    # Scan mainline branches and report all findings:
    push:
      branches: ["master", "develop"]

env:
  # Toggle to run the Nancy OSS Index scan. Disabled by default because several
  # transitive dependencies (quic-go, webtransport-go, pion/dtls) carry known
  # advisories that can only be cleared by upgrading their parent modules.
  # Set to "true" (here, or via a repository variable named NANCY_ENABLED) to
  # enable the scan.
  NANCY_ENABLED: ${{ vars.NANCY_ENABLED || 'false' }}

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
        matrix:
          go-version: [1.25.x]
          os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Set up Go 1.x in order to write go.list file
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Install Nancy
      if: ${{ env.NANCY_ENABLED == 'true' }}
      run: |
        curl -sSL -o nancy https://github.com/sonatype-nexus-community/nancy/releases/download/v1.0.52/nancy-v1.0.52-linux-amd64
        chmod +x nancy
        sudo mv nancy /usr/local/bin/
        file /usr/local/bin/nancy

    - name: Nancy Security Scan
      if: ${{ env.NANCY_ENABLED == 'true' }}
      shell: bash
      env:
        OSSINDEX_USERNAME: ${{ secrets.OSSINDEX_USERNAME }}
        OSSINDEX_TOKEN: ${{ secrets.OSSINDEX_TOKEN }}
      run: |
        if [[ -z "${OSSINDEX_USERNAME:-}" || -z "${OSSINDEX_TOKEN:-}" ]]; then
          echo "::error::Missing OSS Index credentials"
        fi

        go list -json -deps ./... | nancy sleuth --username "${OSSINDEX_USERNAME}" --token "${OSSINDEX_TOKEN}"

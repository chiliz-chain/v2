# Build the geth image from a release tag, smoke-test it, and publish it to
# Docker Hub as chilizchain/ccv2-geth:<tag> -- the image the Spicy and mainnet
# nodes run. Replaces the manual `docker build --platform linux/amd64` +
# `docker push` done from a laptop (IFT-1545).
#
# dry_run (the default) builds and tests only: no Docker Hub login, no push.
#
# Unlike docker-release.yml, the build context is the checked-out tag
# (`context: src`). Without a local context BuildKit clones the repository
# itself and fails fetching the `genesis` submodule over SSH; the image does
# not need that submodule (network configs are embedded from
# config/embedded/).
name: Docker Hub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v2.10.9 or v2.10.9-rc1"
        required: true
        type: string
      dry_run:
        description: "Build and smoke-test only; do not push"
        required: false
        type: boolean
        default: true
      push_latest:
        description: "Also move `latest` to this image (final releases only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  # Docker Hub login uses an OIDC connection of the chilizchain organization:
  # the job exchanges its GitHub ID token for short-lived Docker Hub access, so
  # no Docker Hub token is stored in this repository.
  id-token: write

concurrency:
  group: dockerhub-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE: chilizchain/ccv2-geth
  TAG: ${{ inputs.tag }}
  DRY_RUN: ${{ inputs.dry_run }}
  PUSH_LATEST: ${{ inputs.push_latest }}

jobs:
  release:
    # amd64 only: every chilizchain/ccv2-geth image since v2.0.4 is amd64-only,
    # and so are the nodes that run it.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::tag '$TAG' is not vX.Y.Z or vX.Y.Z-rcN"; exit 1
          fi
          if [[ "$PUSH_LATEST" == "true" && "$TAG" == *-rc* ]]; then
            echo "::error::push_latest is for final releases; $TAG is a release candidate"; exit 1
          fi
          echo "image=$IMAGE:$TAG dry_run=$DRY_RUN push_latest=$PUSH_LATEST"

      # The tag is the build context (src/). The CI scripts come from the
      # workflow's own commit (ci/): a release tag cut before this workflow
      # existed does not contain them.
      - name: Checkout the tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ env.TAG }}
          path: src
          persist-credentials: false

      - name: Checkout the CI scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: ci
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Resolve the tag commit
        id: src
        working-directory: src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Published tags are never overwritten. In a dry run an existing tag is
      # reported and the build still runs, so a published image can be rebuilt
      # and checked.
      - name: Check the tag is not on Docker Hub yet
        run: |
          set -euo pipefail
          url="https://hub.docker.com/v2/repositories/$IMAGE/tags/$TAG"
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$url")
          case "$code" in
            404) echo "$IMAGE:$TAG is not on Docker Hub" ;;
            200)
              if [[ "$DRY_RUN" == "true" ]]; then
                echo "::warning::$IMAGE:$TAG already exists on Docker Hub; a real run would stop here"
              else
                echo "::error::$IMAGE:$TAG already exists on Docker Hub; published tags are never overwritten"; exit 1
              fi ;;
            *) echo "::error::Docker Hub returned HTTP $code for $url"; exit 1 ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Loaded into the local daemon, not pushed: the image that is smoke-tested
      # below is the exact image that gets pushed.
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: src
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ steps.src.outputs.sha }}
            org.opencontainers.image.licenses=LGPL-3.0,GPL-3.0

      - name: Smoke test
        working-directory: src
        run: ../ci/.github/scripts/docker-image-smoke-test.sh "$IMAGE:$TAG" "$TAG"

      # The connection's ruleset grants Image Push on chilizchain/ccv2-geth to
      # runs from refs/heads/master only.
      - name: Log in to Docker Hub
        if: ${{ env.DRY_RUN == 'false' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: chilizchain
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}

      - name: Push
        if: ${{ env.DRY_RUN == 'false' }}
        run: |
          set -euo pipefail
          docker push "$IMAGE:$TAG"
          if [[ "$PUSH_LATEST" == "true" ]]; then
            docker tag "$IMAGE:$TAG" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

      - name: Summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          {
            echo "### $IMAGE:$TAG"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| tag commit | \`${{ steps.src.outputs.sha }}\` |"
            echo "| dry run | $DRY_RUN |"
            echo "| push latest | $PUSH_LATEST |"
            if docker image inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
              echo "| image id | \`$(docker image inspect -f '{{.Id}}' "$IMAGE:$TAG")\` |"
              echo "| architecture | $(docker image inspect -f '{{.Os}}/{{.Architecture}}' "$IMAGE:$TAG") |"
              echo "| repo digest | \`$(docker image inspect -f '{{join .RepoDigests " "}}' "$IMAGE:$TAG")\` |"
            else
              echo "| image | not built |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
